sonar.organization=kamenitxan
sonar.projectKey=kamenitxan_Jakon_AYX5P6qaok6eoBlpoZHT

# Relative paths to source directories. More details and properties are described
# in https://sonarcloud.io/documentation/project-administration/narrowing-the-focus/
sonar.sources=modules/core/src/main,modules/shop/src/main,modules/frontend/src/main
sonar.tests=modules/core/src/test,modules/shop/src/test

sonar.exclusions=**/src/main/resources/**

# Scanner must run after a build (e.g. `sbt githubTest`), otherwise these paths do not exist
# and the Java sensor fails. The .java files (annotations) live under src/main/scala.
sonar.java.binaries=modules/core/target/scala-*/classes,modules/shop/target/scala-*/classes
sonar.java.test.binaries=modules/core/target/scala-*/test-classes,modules/shop/target/scala-*/test-classes
sonar.java.source=17

# Produced by `sbt githubTest` (coverageReport). Missing reports are only a warning.
sonar.scala.coverage.reportPaths=modules/core/target/scala-*/scoverage-report/scoverage.xml,modules/shop/target/scala-*/scoverage-report/scoverage.xml
