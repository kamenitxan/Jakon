# Configuration of shop integration tests (ShopTestRunner), working directory is modules/shop
# copied from modules/core/templates/shop by ShopTestRunner
templateDir=target/test-templates/shop
# Javalin needs this dir on classpath too - see src/test/resources/target/test-static
staticDir=target/test-static
outputDir=target/test-out/
databaseDriver=org.sqlite.JDBC
databaseConnPath=jdbc:sqlite:target/jakonShopTest.sqlite
databaseUser=
databasePass=
port=4577
host=127.0.0.1
deployMode=DEVEL
DEPLOY.type=cz.kamenitxan.jakon.core.deploy.DummyDeploy
defaultLocale=cs_CZ
supportedLocales=cs_CZ,en_US
# enabled so emails are stored in DB, nothing is sent - smtp host does not exist
MAIL.enabled=true
MAIL.auth=false
MAIL.host=smtp.invalid
MAIL.port=25
package=cz.kamenitxan.jakon.shop
hostname=localhost
emailValidator.checkDns=false
shop.return.name=Test Shop
shop.return.street=Testovací 1
shop.return.city=Praha
shop.return.zip=11000
shop.return.country=CZ
