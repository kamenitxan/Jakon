sonar.projectKey=kamenitxan_Jakon_AYX5P6qaok6eoBlpoZHT

# Relative paths to source directories. More details and properties are described
# in https://sonarcloud.io/documentation/project-administration/narrowing-the-focus/
# NOTE: any -Dsonar.sources passed on the scanner command line (e.g. from the
# TeamCity SonarQube build step) takes precedence over this file and silently
# drops the modules listed here. Leave that field empty in the build step.
sonar.sources=modules/core/src/main,modules/shop/src/main

# Test code is intentionally not analysed. Both patterns are needed so the tests stay
# out even if sonar.sources gets overridden to a wider path on the command line.
sonar.exclusions=**/src/main/resources/**,**/src/test/**
sonar.test.exclusions=**/*

# Scanner must run after a build (e.g. `sbt githubTest`), otherwise these paths do not exist
# and the Java sensor fails. The .java files (annotations) live under src/main/scala.
sonar.java.binaries=modules/core/target/scala-*/classes,modules/shop/target/scala-*/classes
sonar.java.source=25

# Produced by `sbt githubTest` (coverageReport). Wildcards are NOT supported here, hence
# `coverageDataDir := target.value` in build.sbt keeps the Scala version out of the path.
sonar.scala.coverage.reportPaths=modules/core/target/scoverage-report/scoverage.xml,modules/shop/target/scoverage-report/scoverage.xml
